<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Imagem do convite</title>
  <!-- Arte para enviar junto com o link (1080×1350). Gerada como PNG pelo navegador headless. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; }
    body {
      font-family: "DM Sans", sans-serif;
      color: #2f3a2f;
      background: linear-gradient(180deg, #e3eedf 0%, #f3f2e6 55%, #faf5ec 100%);
      position: relative;
    }
    .moldura {
      position: absolute; inset: 36px;
      border: 3px solid rgba(79, 122, 82, 0.25);
      border-radius: 48px;
    }
    .conteudo {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      padding: 150px 110px 0;
    }
    .eyebrow {
      font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: #c8714f; font-size: 30px;
    }
    h1 {
      font-family: "Fraunces", serif; font-weight: 700;
      color: #4f7a52; line-height: 1.02;
      font-size: 128px; margin-top: 30px;
    }
    .data {
      margin-top: 44px;
      display: inline-flex; align-items: center; gap: 20px;
      background: #fff; border-radius: 999px;
      padding: 20px 44px;
      font-size: 38px; font-weight: 700;
      box-shadow: 0 10px 30px rgba(60, 50, 30, 0.08);
    }
    .data span { color: #c8714f; }
    .texto {
      margin-top: 50px;
      font-size: 38px; line-height: 1.45; color: #5d685a;
      max-width: 820px;
    }
    .texto strong { color: #2f3a2f; }
    .plantas { position: absolute; left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; }
    .plantas svg { width: 900px; height: auto; }
    .rodape {
      position: absolute; left: 0; right: 0; bottom: 82px;
      text-align: center; font-size: 32px; font-weight: 700; color: #4f7a52;
    }
  </style>
</head>
<body>
  <div class="moldura"></div>
  <div class="conteudo">
    <p class="eyebrow">Lista de presentes</p>
    <h1>Aniversário da<br>Marinalva</h1>
    <p class="data">Sábado, 21 de novembro <span>·</span> 18h30</p>
    <p class="texto">
      Em vez de presentes, escolha uma <strong>plantinha</strong> da lista de
      cactos e suculentas e presenteie pelo <strong>Pix</strong>. 🌵
    </p>
  </div>
  <div class="plantas">
    <svg viewBox="0 0 520 140" id="plantas"></svg>
  </div>
  <p class="rodape">Toque no link da mensagem para ver a lista</p>

  <script src="../desenhos.js"></script>
  <script>
    document.getElementById("plantas").innerHTML = [
      Desenhos.grupo("coluna", 0, 8, 1.1),
      Desenhos.grupo("roseta", 105, 36, 0.86),
      Desenhos.grupo("bola", 195, 18, 1.0),
      Desenhos.grupo("babosa", 300, 18, 1.02),
      Desenhos.grupo("orelha", 405, 22, 0.98),
    ].join("");
  </script>
</body>
</html>
